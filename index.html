<!doctype html>
<html lang="it">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Portale Bandi</title>


<style>

/* =========================================================
   VARIABILI
========================================================= */

:root{

  --bg:#f4f6fa;

  --card:#ffffff;

  --ink:#182230;

  --muted:#667085;

  --line:#e3e7ee;

  --accent:#111827;

  --gold:#f5b700;

  --blue:#2563eb;

  --green:#067647;

  --green-bg:#ecfdf3;

  --orange:#b54708;

  --orange-bg:#fffaeb;

  --red:#b42318;

  --red-bg:#fee4e2;

}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:var(--bg);

  color:var(--ink);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

}


/* =========================================================
   HEADER
========================================================= */

header{

  background:#111827;

  color:#fff;

  padding:
    30px
    max(24px,6vw)
    34px;

}


.eyebrow{

  font-size:12px;

  text-transform:uppercase;

  letter-spacing:.14em;

  color:#aab4c4;

  font-weight:700;

}


.title{

  font-size:36px;

  font-weight:800;

  margin:8px 0 4px;

}


.sub{

  color:#c7cfdb;

}


/* =========================================================
   MAIN
========================================================= */

main{

  max-width:1450px;

  margin:auto;

  padding:26px 24px 70px;

}


/* =========================================================
   LAYOUT
========================================================= */

.layout{

  display:grid;

  grid-template-columns:250px minmax(0,1fr);

  gap:24px;

  align-items:start;

}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

  background:#fff;

  border:1px solid var(--line);

  border-radius:15px;

  padding:17px;

  position:sticky;

  top:20px;

  box-shadow:
    0 3px 12px #1118270a;

}


.filter-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  padding-bottom:15px;

  margin-bottom:4px;

  border-bottom:1px solid var(--line);

}


.filter-title{

  font-size:15px;

  font-weight:800;

}


.filter-result{

  display:block;

  color:var(--muted);

  font-size:11px;

  margin-top:3px;

}


.reset-btn{

  border:0;

  background:#eef1f5;

  color:#182230;

  border-radius:8px;

  padding:7px 9px;

  cursor:pointer;

  font-size:11px;

  font-weight:800;

}


.reset-btn:hover{

  background:#e3e7ee;

}


.filter-group{

  display:flex;

  flex-direction:column;

  gap:6px;

  margin-top:17px;

}


.filter-group label{

  font-size:11px;

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:.04em;

  color:#667085;

}


.filter-group select,
.filter-group input{

  width:100%;

  min-width:0;

  padding:9px 10px;

  font-size:13px;

}


/* =========================================================
   CONTENT
========================================================= */

.content{

  min-width:0;

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

  display:flex;

  gap:10px;

  flex-wrap:wrap;

  margin-bottom:18px;

}


input,
select,
textarea{

  border:1px solid var(--line);

  background:#fff;

  border-radius:10px;

  padding:11px 13px;

  font:inherit;

  color:inherit;

  outline:none;

}


input:focus,
select:focus,
textarea:focus{

  border-color:#98a2b3;

  box-shadow:
    0 0 0 3px #1118270d;

}


#search{

  flex:1;

  min-width:240px;

}


/* =========================================================
   BUTTONS
========================================================= */

.btn{

  border:0;

  border-radius:9px;

  padding:9px 11px;

  font-weight:700;

  cursor:pointer;

  background:#111827;

  color:white;

  text-decoration:none;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:5px;

}


.btn:hover{

  background:#1f2937;

}


.btn.light{

  background:#eef1f5;

  color:#182230;

}


.btn.light:hover{

  background:#e4e8ee;

}


.danger{

  background:#fee4e2!important;

  color:#b42318!important;

}


/* =========================================================
   TABS
========================================================= */

.tabs{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-bottom:14px;

}


.tab{

  border:1px solid var(--line);

  background:#fff;

  padding:9px 13px;

  border-radius:999px;

  cursor:pointer;

  font-weight:700;

  font-size:13px;

}


.tab:hover{

  background:#f8fafc;

}


.tab.active{

  background:#111827;

  color:#fff;

  border-color:#111827;

}


/* =========================================================
   RISULTATI
========================================================= */

.results-info{

  color:var(--muted);

  font-size:12px;

  margin:0 0 13px;

}


/* =========================================================
   CARDS
========================================================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(320px,1fr)
    );

  gap:15px;

}


.card{

  background:var(--card);

  border:1px solid var(--line);

  border-radius:15px;

  padding:18px;

  box-shadow:
    0 3px 12px #1118270a;

  position:relative;

  transition:
    transform .15s ease,
    box-shadow .15s ease;

}


.card:hover{

  transform:translateY(-1px);

  box-shadow:
    0 6px 18px #11182712;

}


.card h3{

  margin:
    10px
    52px
    5px
    0;

  font-size:18px;

}


.entity{

  font-size:13px;

  color:var(--muted);

  margin-bottom:13px;

}


.pill{

  font-size:11px;

  padding:5px 8px;

  border-radius:99px;

  background:#eef2f7;

  font-weight:800;

  display:inline-block;

}


.status{

  float:right;

}


.star{

  position:absolute;

  bottom:16px;

  right:16px;

  z-index:2;

  border:0;

  background:#f4f6fa;

  border-radius:50%;

  width:34px;

  height:34px;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  font-size:22px;

  line-height:1;

  color:#c8ced8;

  padding:0;

}


.star.active{

  color:var(--gold);

}


.badges{

  display:flex;

  flex-wrap:wrap;

  gap:6px;

  margin-bottom:12px;

}


.meta-badge{

  display:inline-flex;

  align-items:center;

  gap:4px;

  font-size:11px;

  padding:5px 8px;

  border-radius:99px;

  background:#f1f5f9;

  color:#475467;

  font-weight:700;

}


.date{

  font-size:12px;

  color:var(--muted);

  margin:12px 0;

}


.desc{

  font-size:13px;

  line-height:1.45;

  color:#475467;

  margin-bottom:14px;

}


.actions{

  display:flex;

  gap:8px;

  margin-top:16px;

  padding-right:46px;

  flex-wrap:wrap;

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

  display:none;

  text-align:center;

  padding:55px;

  color:var(--muted);

  background:#fff;

  border:1px dashed var(--line);

  border-radius:15px;

}


/* =========================================================
   MODAL
========================================================= */

.modal{

  display:none;

  position:fixed;

  inset:0;

  background:#101828aa;

  z-index:20;

  padding:20px;

  align-items:center;

  justify-content:center;

}


.modal.show{

  display:flex;

}


.box{

  background:#fff;

  width:min(900px,100%);

  max-height:92vh;

  overflow:auto;

  border-radius:18px;

  padding:25px;

  box-shadow:
    0 20px 50px #00000025;

}


.close{

  float:right;

  border:0;

  background:#f2f4f7;

  border-radius:50%;

  width:34px;

  height:34px;

  cursor:pointer;

  font-size:20px;

}


.close:hover{

  background:#e4e7ec;

}


.box h2{

  margin:
    0
    45px
    22px
    0;

}


/* =========================================================
   FORM
========================================================= */

.formgrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;

}


.field{

  display:flex;

  flex-direction:column;

  gap:6px;

}


.field.full{

  grid-column:1/-1;

}


.field label{

  font-size:12px;

  font-weight:800;

  color:#667085;

}


.field input,
.field select,
.field textarea{

  width:100%;

}


.field textarea{

  min-height:110px;

  resize:vertical;

}


.section-title{

  grid-column:1/-1;

  font-size:14px;

  font-weight:800;

  padding:12px 0 2px;

  border-bottom:1px solid var(--line);

  margin-top:5px;

}


.footer-actions{

  display:flex;

  gap:9px;

  margin-top:20px;

}


.footer-actions .btn{

  flex:1;

}


.notice{

  padding:12px 14px;

  background:#fff8e7;

  border-radius:10px;

  font-size:12px;

  color:#664d03;

  margin:18px 0;

}


/* =========================================================
   LETTURA
========================================================= */

.read-view{

  display:block;

}


.read-grid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:0;

  border-top:1px solid var(--line);

}


.read-item{

  padding:14px 10px 14px 0;

  border-bottom:1px solid var(--line);

}


.read-item.full{

  grid-column:1/-1;

}


.read-label{

  display:block;

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:.04em;

  font-weight:800;

  color:#667085;

  margin-bottom:5px;

}


.read-value{

  font-size:14px;

  line-height:1.5;

  white-space:pre-wrap;

}


.read-empty{

  color:#98a2b3;

  font-style:italic;

}


.mode-actions{

  display:flex;

  gap:9px;

  margin-top:20px;

  flex-wrap:wrap;

}


.mode-actions .btn{

  flex:1;

}


/* =========================================================
   MULTI ATECO
========================================================= */

.help-text{

  font-size:11px;

  color:#98a2b3;

  line-height:1.35;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

  .layout{

    grid-template-columns:1fr;

  }

  .sidebar{

    position:static;

  }

  .filter-header{

    margin-bottom:0;

  }

}


@media(max-width:650px){

  .formgrid{

    grid-template-columns:1fr;

  }

  .field.full,
  .section-title{

    grid-column:auto;

  }

  .title{

    font-size:29px;

  }

  .read-grid{

    grid-template-columns:1fr;

  }

  .read-item.full{

    grid-column:auto;

  }

  .sidebar{

    padding:14px;

  }

  .grid{

    grid-template-columns:1fr;

  }

}


</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div class="eyebrow">
    Finanza agevolata
  </div>

  <div class="title">
    Portale Bandi
  </div>

  <div class="sub">
    Schede di sintesi, scadenze, ATECO e fonti ufficiali
  </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>

  <div class="layout">


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

      <div class="filter-header">

        <div>

          <div class="filter-title">
            Filtri
          </div>

          <span
            class="filter-result"
            id="filterCount"
          >
            0 risultati
          </span>

        </div>

        <button
          class="reset-btn"
          onclick="resetFilters()"
        >
          Azzera
        </button>

      </div>


      <!-- ATECO -->

      <div class="filter-group">

        <label for="filterAteco">
          ATECO
        </label>

        <select
          id="filterAteco"
          onchange="render()"
        >

          <option value="">
            Tutti gli ATECO
          </option>

        </select>

      </div>


      <!-- ENTE -->

      <div class="filter-group">

        <label for="filterEnte">
          Ente
        </label>

        <select
          id="filterEnte"
          onchange="render()"
        >

          <option value="">
            Tutti gli enti
          </option>

        </select>

      </div>


      <!-- LUOGO -->

      <div class="filter-group">

        <label for="filterLuogo">
          Luogo / territorio
        </label>

        <select
          id="filterLuogo"
          onchange="render()"
        >

          <option value="">
            Tutti i luoghi
          </option>

        </select>

      </div>


      <!-- CATEGORIA -->

      <div class="filter-group">

        <label for="cat">
          Categoria
        </label>

        <select
          id="cat"
          onchange="render()"
        >

          <option value="">
            Tutte le categorie
          </option>

        </select>

      </div>

    </aside>


    <!-- =================================================
         CONTENT
    ================================================== -->

    <section class="content">


      <!-- TOOLBAR -->

      <div class="toolbar">

        <input
          id="search"
          placeholder="Cerca bando, ente, ATECO, luogo o categoria…"
          oninput="render()"
        >

        <button
          class="btn"
          onclick="newBando()"
        >
          ＋ Aggiungi bando
        </button>

      </div>


      <!-- TABS -->

      <div
        class="tabs"
        id="tabs"
      ></div>


      <!-- RISULTATI -->

      <div
        class="results-info"
        id="resultsCount"
      ></div>


      <!-- GRID -->

      <div
        class="grid"
        id="grid"
      ></div>


      <!-- EMPTY -->

      <div
        class="empty"
        id="empty"
      >
        Nessun bando corrisponde ai filtri.
      </div>


    </section>

  </div>

</main>


<!-- =====================================================
     MODALE
===================================================== -->

<div
  class="modal"
  id="modal"
>

  <div class="box">


    <button
      class="close"
      onclick="closeModal()"
      aria-label="Chiudi"
    >
      ×
    </button>


    <h2 id="modalTitle">
      Nuovo bando
    </h2>


    <!-- =================================================
         VISTA LETTURA
    ================================================== -->

    <div
      id="readView"
      class="read-view"
      style="display:none"
    >

      <div id="readContent"></div>

      <div class="mode-actions">

        <button
          class="btn light"
          onclick="closeModal()"
        >
          Chiudi
        </button>

        <button
          class="btn"
          onclick="startEdit()"
        >
          ✎ Modifica scheda
        </button>

        <button
          class="btn danger"
          id="readDeleteBtn"
          onclick="deleteBando()"
        >
          Elimina
        </button>

      </div>

    </div>


    <!-- =================================================
         VISTA MODIFICA
    ================================================== -->

    <div
      id="editView"
      style="display:none"
    >

      <div class="formgrid">


        <!-- NOME -->

        <div class="field">

          <label>
            Nome del bando
          </label>

          <input
            id="fNome"
          >

        </div>


        <!-- ENTE -->

        <div class="field">

          <label>
            Ente
          </label>

          <input
            id="fEnte"
            list="enteList"
          >

          <datalist id="enteList"></datalist>

        </div>


        <!-- CATEGORIA -->

        <div class="field">

          <label>
            Categoria
          </label>

          <input
            id="fCat"
            list="categoryList"
          >

          <datalist id="categoryList"></datalist>

        </div>


        <!-- ATECO -->

        <div class="field">

          <label>
            Codici ATECO
          </label>

          <input
            id="fAteco"
            list="atecoList"
            placeholder="Es. 62.01, 25.11, 10.71"
          >

          <datalist id="atecoList"></datalist>

          <div class="help-text">
            Puoi inserire più codici separati da virgola.
          </div>

        </div>


        <!-- LUOGO -->

        <div class="field">

          <label>
            Luogo / territorio
          </label>

          <input
            id="fLuogo"
            list="luogoList"
            placeholder="Es. Italia, Lombardia, Milano"
          >

          <datalist id="luogoList"></datalist>

        </div>


        <!-- STATO -->

        <div class="field">

          <label>
            Stato
          </label>

          <select id="fStato">

            <option>
              Attivi
            </option>

            <option>
              In apertura
            </option>

            <option>
              Chiusi
            </option>

            <option>
              Da verificare
            </option>

          </select>

        </div>


        <!-- APERTURA -->

        <div class="field">

          <label>
            Modalità di apertura
          </label>

          <select id="fApertura">

            <option value="">
              Non specificato
            </option>

            <option value="A sportello">
              A sportello
            </option>

            <option value="A graduatoria">
              A graduatoria
            </option>

            <option value="Click Day">
              Click Day
            </option>

          </select>

        </div>


        <!-- SCADENZA -->

        <div class="field">

          <label>
            Scadenza
          </label>

          <input
            id="fScad"
            type="date"
          >

        </div>


        <!-- URL -->

        <div class="field full">

          <label>
            Link al testo ufficiale
          </label>

          <input
            id="fUrl"
            type="url"
            placeholder="https://…"
          >

        </div>


        <!-- SEZIONE -->

        <div class="section-title">
          Scheda di sintesi
        </div>


        <!-- DESCRIZIONE -->

        <div class="field full">

          <label>
            Breve descrizione
          </label>

          <textarea
            id="fDescrizione"
          ></textarea>

        </div>


        <!-- BENEFICIARI -->

        <div class="field full">

          <label>
            Soggetti beneficiari
          </label>

          <textarea
            id="fBeneficiari"
          ></textarea>

        </div>


        <!-- AGEVOLAZIONE -->

        <div class="field full">

          <label>
            Entità e forma agevolazione
          </label>

          <textarea
            id="fAgevolazione"
          ></textarea>

        </div>


        <!-- SPESE -->

        <div class="field full">

          <label>
            Spese ammissibili
          </label>

          <textarea
            id="fSpese"
          ></textarea>

        </div>


        <!-- NOTE -->

        <div class="field full">

          <label>
            Note operative personali
          </label>

          <textarea
            id="fNote"
          ></textarea>

        </div>


      </div>


      <div class="notice">

        I dati vengono salvati nel
        <b>browser di questo dispositivo</b>
        tramite memoria locale.

      </div>


      <div class="footer-actions">

        <button
          class="btn light"
          onclick="cancelEdit()"
        >
          Annulla
        </button>

        <button
          class="btn"
          onclick="saveBando()"
        >
          Salva
        </button>

        <button
          class="btn danger"
          id="deleteBtn"
          style="display:none"
          onclick="deleteBando()"
        >
          Elimina
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

/* =========================================================

========================================================= */

function normalizeBando(x){

  return {

    nome:x.nome || '',

    ente:x.ente || '',

    categoria:x.categoria || '',

    ateco:x.ateco || '',

    luogo:x.luogo || '',

    stato:x.stato || 'Da verificare',

    apertura:x.apertura || '',

    scadenza:x.scadenza || '',

    url:x.url || '',

    descrizione:
      x.descrizione ||
      x.sintesi ||
      '',

    beneficiari:x.beneficiari || '',

    agevolazione:x.agevolazione || '',

    spese:x.spese || '',

    note:x.note || '',

    preferito:
      x.preferito === true

  };

}


bandi =
  bandi.map(normalizeBando);


localStorage.setItem(
  KEY,
  JSON.stringify(bandi)
);


/* =========================================================
   SALVATAGGIO
========================================================= */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(bandi)
  );

}


/* =========================================================
   VALORI UNICI
========================================================= */

function uniqueValues(field){

  const values = [];

  bandi.forEach(x => {

    const value = x[field];

    if(!value) return;


    String(value)
      .split(',')
      .map(v => v.trim())
      .filter(Boolean)
      .forEach(v => {

        if(!values.includes(v)){
          values.push(v);
        }

      });

  });


  return values.sort(
    (a,b) =>
      a.localeCompare(
        b,
        'it',
        {numeric:true}
      )
  );

}


/* =========================================================
   POPOLA SELECT
========================================================= */

function populateSelect(
  id,
  field,
  defaultLabel
){

  const select =
    document.getElementById(id);

  if(!select) return;

  const current =
    select.value;

  const values =
    uniqueValues(field);


  select.innerHTML =
    `<option value="">
      ${esc(defaultLabel)}
     </option>` +

    values
      .map(v =>
        `<option value="${esc(v)}">
          ${esc(v)}
         </option>`
      )
      .join('');


  if(values.includes(current)){
    select.value = current;
  }

}


/* =========================================================
   DATALIST
========================================================= */

function populateDatalist(
  id,
  field
){

  const list =
    document.getElementById(id);

  if(!list) return;


  const values =
    uniqueValues(field);


  list.innerHTML =
    values
      .map(v =>
        `<option value="${esc(v)}"></option>`
      )
      .join('');

}

/* =========================================================
   TABS
========================================================= */

function renderTabs(){

  const states = [

    'Tutti',

    'Preferiti',

    'Attivi',

    'In apertura',

    'Chiusi',

    'Da verificare'

  ];


  document.getElementById('tabs').innerHTML =

    states.map(s => {

      let count;


      if(s === 'Tutti'){

        count =
          bandi.length;

      }

      else if(s === 'Preferiti'){

        count =
          bandi.filter(
            x => x.preferito === true
          ).length;

      }

      else{

        count =
          bandi.filter(
            x => x.stato === s
          ).length;

      }


      return `

        <button
          class="tab ${filter === s ? 'active' : ''}"
          onclick="setFilter('${escAttr(s)}')"
        >

          ${esc(s)}

          <span>
            (${count})
          </span>

        </button>

      `;

    }).join('');

}


/* =========================================================
   CAMBIO FILTRO STATO
========================================================= */

function setFilter(s){

  filter = s;

  renderTabs();

  render();

}

========================================================= */

function resetFilters(){

  document.getElementById('search').value = '';

  document.getElementById('filterAteco').value = '';

  document.getElementById('filterEnte').value = '';

  document.getElementById('filterLuogo').value = '';

  document.getElementById('cat').value = '';

  filter = 'Tutti';

  renderTabs();

  render();

}


/* =========================================================
   RICERCA
========================================================= */

function render(){

  const q =
    document
      .getElementById('search')
      .value
      .toLowerCase()
      .trim();


  const categoria =
    document
      .getElementById('cat')
      .value;


  const ateco =
    document
      .getElementById('filterAteco')
      .value;


  const ente =
    document
      .getElementById('filterEnte')
      .value;


  const luogo =
    document
      .getElementById('filterLuogo')
      .value;


  const list =

    bandi

      .map(
        (x,i) => ({
          ...x,
          i
        })
      )

      .filter(x => {


        /* STATO */

        const statoOk =

          filter === 'Tutti'

          ||

          (
            filter === 'Preferiti'

            ?

            x.preferito === true

            :

            x.stato === filter
          );


        /* CATEGORIA */

        const categoriaOk =

          !categoria

          ||

          x.categoria === categoria;


        /* ATECO */

        const atecoOk =

          !ateco

          ||

          String(x.ateco || '')
            .split(',')
            .map(v => v.trim())
            .includes(ateco)

          ||

          String(x.ateco || '')
            .toLowerCase()
            .includes(
              ateco.toLowerCase()
            );


        /* ENTE */

        const enteOk =

          !ente

          ||

          x.ente === ente;


        /* LUOGO */

        const luogoOk =

          !luogo

          ||

          String(x.luogo || '')
            .toLowerCase()
            .includes(
              luogo.toLowerCase()
            );


        /* RICERCA TESTUALE */

        const testo = `

          ${x.nome || ''}

          ${x.ente || ''}

          ${x.categoria || ''}

          ${x.ateco || ''}

          ${x.luogo || ''}

          ${x.stato || ''}

          ${x.apertura || ''}

          ${x.descrizione || ''}

          ${x.beneficiari || ''}

          ${x.agevolazione || ''}

          ${x.spese || ''}

          ${x.note || ''}

        `.toLowerCase();


        const ricercaOk =
          testo.includes(q);


        return (

          statoOk &&

          categoriaOk &&

          atecoOk &&

          enteOk &&

          luogoOk &&

          ricercaOk

        );

      });


  /* CARDS */

  document.getElementById('grid').innerHTML =

    list
      .map(card)
      .join('');


  /* EMPTY */

  document.getElementById('empty')
    .style.display =
      list.length
        ? 'none'
        : 'block';


  /* COUNT */

  const label =
    list.length === 1
      ? 'bando'
      : 'bandi';


  document.getElementById('resultsCount')
    .textContent =
      `${list.length} ${label} visualizzati`;


  document.getElementById('filterCount')
    .textContent =
      `${list.length} risultati`;

}

  return `

    <article class="card">


      <!-- PREFERITO -->

      <button

        class="star ${
          x.preferito
            ? 'active'
            : ''
        }"

        onclick="
          togglePreferito(${x.i})
        "

        title="${
          x.preferito
            ? 'Rimuovi dai preferiti'
            : 'Aggiungi ai preferiti'
        }"

      >

        ${

      </button>

        ${esc(

        )}

      </div>


      <!-- META -->

      <div class="badges">


        ${
          x.ateco

          ?

          `

          <span class="meta-badge">

            ATECO:
            ${esc(x.ateco)}

          </span>

          `

          :

          ''

        }


        ${
          x.luogo

          ?

          `

          <span class="meta-badge">

            📍
            ${esc(x.luogo)}

          </span>

          `

          :

          ''

        }


        ${
          x.apertura

          ?

          `

          <span class="meta-badge">

            ${esc(x.apertura)}

          </span>

          `

          :

          ''

        }


      </div>


      <!-- DESCRIZIONE -->

      <div class="desc">

        ${esc(
          x.descrizione ||

        )}

      <!-- DATA -->

        <button

/* =========================================================
   ANNULLA MODIFICA
========================================================= */

function cancelEdit(){

  if(editIndex !== null){

    renderReadView(
      bandi[editIndex]
    );


    document.getElementById(
      'modalTitle'
    )
    .textContent =
      bandi[editIndex].nome ||
      'Scheda bando';


    showReadView();

  }

  else{

    closeModal();

  }

}


/* =========================================================
   RIEMPI FORM
========================================================= */

function fill(x){

  document.getElementById(
    'fNome'
  ).value =
    x.nome || '';


  document.getElementById(
    'fEnte'
  ).value =
    x.ente || '';


  document.getElementById(
    'fCat'
  ).value =
    x.categoria || '';


  document.getElementById(
    'fAteco'
  ).value =
    x.ateco || '';


  document.getElementById(
    'fLuogo'
  ).value =
    x.luogo || '';


  document.getElementById(
    'fStato'
  ).value =
    x.stato ||
    'Attivi';


  document.getElementById(
    'fApertura'
  ).value =
    x.apertura || '';


  document.getElementById(
    'fScad'
  ).value =
    x.scadenza || '';


  document.getElementById(
    'fUrl'
  ).value =
    x.url || '';


  document.getElementById(
    'fDescrizione'
  ).value =
    x.descrizione ||
    x.sintesi ||
    '';


  document.getElementById(
    'fBeneficiari'
  ).value =
    x.beneficiari || '';


  document.getElementById(
    'fAgevolazione'
  ).value =
    x.agevolazione || '';


  document.getElementById(
    'fSpese'
  ).value =
    x.spese || '';


  document.getElementById(
    'fNote'
  ).value =
    x.note || '';

}


/* =========================================================
   VALUE HELPER
========================================================= */

function f(id){

  return document
    .getElementById(id)
    .value
    .trim();

}


/* =========================================================
   LETTURA FORM
========================================================= */

function read(){

  return {

    nome:
      f('fNome'),

    ente:
      f('fEnte'),

    categoria:
      f('fCat'),

    ateco:
      f('fAteco'),

    luogo:
      f('fLuogo'),

    stato:
      document
        .getElementById('fStato')
        .value,

    apertura:
      document
        .getElementById('fApertura')
        .value,

    scadenza:
      document
        .getElementById('fScad')
        .value,

    url:
      f('fUrl'),

    descrizione:
      f('fDescrizione'),

    beneficiari:
      f('fBeneficiari'),

    agevolazione:
      f('fAgevolazione'),

    spese:
      f('fSpese'),

    note:
      f('fNote'),

    preferito:
      editIndex !== null
        ? bandi[editIndex].preferito
        : false

  };

}


/* =========================================================
   SALVA BANDO
========================================================= */

function saveBando(){

  const x =
    read();


  if(!x.nome){

    alert(
      'Inserisci almeno il nome del bando.'
    );

    return;

  }


  if(editIndex === null){

    bandi.push(x);

  }

  else{

    bandi[editIndex] =
      x;

  }


  save();

  closeModal();

  setup();

}


/* =========================================================
   ELIMINA
========================================================= */

function deleteBando(){

  if(

    editIndex !== null

    &&

    confirm(
      'Eliminare questa scheda?'
    )

  ){

    bandi.splice(
      editIndex,
      1
    );


    save();

    closeModal();

    setup();

  }

}


/* =========================================================
   MODAL
========================================================= */

function openModal(){

  document
    .getElementById('modal')
    .classList
    .add('show');

}


function closeModal(){

  document
    .getElementById('modal')
    .classList
    .remove('show');

}


/* =========================================================
   CHIUDI CLICCANDO FUORI
========================================================= */

document
  .getElementById('modal')
  .addEventListener(
    'click',
    function(e){

      if(e.target === this){

        closeModal();

      }

    }
  );


/* =========================================================
   ESC PER CHIUDERE
========================================================= */

document.addEventListener(
  'keydown',
  function(e){

    if(
      e.key === 'Escape'
      &&
      document
        .getElementById('modal')
        .classList
        .contains('show')
    ){

      closeModal();

    }

  }
);


/* =========================================================
   SICUREZZA TESTO
========================================================= */

function esc(s){

  return String(s ?? '')
    .replace(
      /[&<>"']/g,
      m => ({

        '&':'&amp;',

        '<':'&lt;',

        '>':'&gt;',

        '"':'&quot;',

        "'":'&#39;'

      }[m])
    );

}


/* =========================================================
   SICUREZZA ATTRIBUTI
========================================================= */

function escAttr(s){

  return String(s ?? '')
    .replace(
      /['"]/g,
      ''
    );

}


/* =========================================================
   SICUREZZA URL
========================================================= */

function safeUrl(u){

  try{

    const x =
      new URL(u);


    return [

      'http:',

      'https:'

    ].includes(
      x.protocol
    )

      ?

      x.href

      :

      '#';

  }

  catch{

    return '#';

  }

}


/* =========================================================
   AVVIO
========================================================= */

setup();


</script>
